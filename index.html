<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sugar Cage 10K KUJI</title>
<style>
:root{--bg:#f4eefb;--ink:#2a1b52;--mute:#6c5a99;--hair:#e2d7f5;--card:#ffffff;--accent:#5b3fa6;--t1:#e9dff8;--t2:#d9c8f4;--t3:#c3a9ee;--pri:#5b3fa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
body{min-height:100dvh;overscroll-behavior:none;margin:0}
html{background:#d9c8f4}
body{background:#d9c8f4}
body::before{content:"";position:fixed;inset:-40px;background:url(assets/pack_front.png) 0 0/84px auto space,url(assets/pack_back.png) 42px 60px/84px auto space;opacity:.1;transform:rotate(-14deg);pointer-events:none}
#device{position:relative;width:min(100vw,430px);height:100dvh;margin:0 auto;overflow:hidden;transform:translateZ(0);background:var(--bg)}
#device>.app{height:100%;overflow:auto}
@media (min-width:600px){#device{height:min(100dvh - 48px,900px);margin-top:24px;border-radius:36px;box-shadow:0 30px 80px rgba(42,27,82,.28)}}
.app{max-width:420px;margin:0 auto;padding:14px 20px 24px;position:relative}

/* 上部の情報（1行・枠なし） */
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--ink);position:relative;flex:none}
.coin::after{content:"";position:absolute;left:3px;top:2px;width:4px;height:3px;border-radius:50%;background:rgba(255,255,255,.9)}
.coin.g{background:radial-gradient(circle at 35% 35%,#fff2c2,#efc35a 60%,#c99327)}
.coin.s{background:radial-gradient(circle at 35% 35%,#fff,#dde2ea 60%,#a3acba)}
.timer{font-variant-numeric:tabular-nums}
.bump{animation:bump .4s cubic-bezier(.2,1.8,.3,1)}
@keyframes bump{40%{transform:scale(1.35)}}

.stage{position:relative;height:540px;margin-top:6px;user-select:none;-webkit-user-select:none}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block;animation:scIn .35s ease both}
@keyframes scIn{from{opacity:0}to{opacity:1}}
.title{text-align:center;font-size:14px;font-weight:700;margin:14px 0 0;letter-spacing:.04em;min-height:20px}
.title small{display:block;font-weight:400;font-size:11px;color:var(--mute);margin-top:3px;letter-spacing:.02em}

/* パックの山（真上から・全画面） */
#scCarton{position:fixed;inset:0;z-index:15;background:var(--t2);overflow:hidden;touch-action:manipulation}
#pile{position:absolute;inset:0}
.pp{position:absolute;width:92px;height:134px;cursor:pointer;filter:drop-shadow(0 4px 5px rgba(42,27,82,.22));transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .45s,filter .45s}
.pp img{width:100%;height:100%;display:block;pointer-events:none}
.pp.take{filter:drop-shadow(0 26px 22px rgba(42,27,82,.45));opacity:0;pointer-events:none}
.ptop{position:absolute;left:12px;right:12px;top:12px;background:#fff;border-radius:28px;padding:14px 16px;z-index:300;box-shadow:0 8px 24px rgba(42,27,82,.16);display:flex;align-items:center;gap:12px}
.ptop b{font-size:26px;color:var(--ink);white-space:nowrap;font-weight:800}
.pslots{display:grid;grid-template-columns:repeat(5,14px);gap:4px;flex:none}
.pslots i{width:14px;height:20px;border-radius:4px;background:var(--t1);transition:transform .3s}
.pslots i.f{background:url(assets/pack_front.png) center/cover;animation:landIn .35s cubic-bezier(.2,1.6,.3,1)}
.plast{color:var(--mute);font-weight:700;font-size:10px;letter-spacing:.1em;text-align:right;line-height:1.1}
.plast span{display:block;font-size:18px;color:var(--ink);letter-spacing:0}
.pauto{position:absolute;left:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:300;height:52px;padding:0 24px;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:15px;border:none;box-shadow:0 6px 18px rgba(42,27,82,.16);cursor:pointer}
#scCarton.go #pile{transition:transform .5s ease-in,opacity .5s;transform:scale(1.15);opacity:0}
/* 開封（テーブルの上） */
#scTear{position:fixed;inset:0;z-index:15;background:var(--t2);overflow:hidden}
#tearCv{z-index:1}
#scTear .ptop{z-index:20}
.pslots i.c{background:#fff;box-shadow:inset 0 0 0 2px var(--t3);animation:landIn .35s cubic-bezier(.2,1.6,.3,1)}

#stack{position:absolute;right:18px;bottom:28px;width:96px;height:134px;z-index:5;pointer-events:none}
#stack .sc{position:absolute;inset:0;border-radius:9px;background:#fff url(assets/logo.png) center/66% no-repeat;box-shadow:0 6px 14px rgba(42,27,82,.18)}
/* めくる（テーブルに広げる） */
#scReveal{position:fixed;inset:0;z-index:15;background:var(--t2);overflow:hidden}
#scReveal .ptop{z-index:20}
#table{position:absolute;inset:0}
.tc{position:absolute;perspective:700px;cursor:pointer;transition:transform .3s}
.tc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.4,1);border-radius:10px}
.tc.open .in{transform:rotateY(180deg)}
.tc .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;box-shadow:0 8px 18px rgba(42,27,82,.2)}
.tc .bk{background:#fff url(assets/logo.png) center/64% no-repeat}
.tc .fr{transform:rotateY(180deg)}
.slip{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;padding:8% 8% 6%}
.slip .tier{font-size:2.6em;font-weight:900;color:var(--ink);line-height:1}
.slip .tier small{font-size:.38em;margin-left:2px}
.slip .thumb{width:100%;flex:1;margin-top:6%;border-radius:8px;background:#f4eefb center top/cover}
.slip .nm{font-size:.62em;font-weight:700;color:var(--mute);margin-top:5%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slip .nw{position:absolute;right:6%;top:6%;background:var(--pri);color:#fff;font-weight:800;font-size:.55em;border-radius:999px;padding:1px 7px;letter-spacing:.06em}
.rbar{position:absolute;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:20}
.rbar .btn{height:58px;padding:0}
#scReveal .gain{bottom:86px;z-index:20}
.dflip .front{background:#fff}
.dflip .front .slip{font-size:28px}
/* えらぶ */
#scSelect{position:fixed;inset:0;z-index:15;background:var(--t2);overflow:hidden}
#scSelect .ptop{z-index:20}
#sTier{font-size:30px}#sTier small{font-size:14px;margin-left:2px}
.stxt{font-weight:800;font-size:14px;color:var(--mute);letter-spacing:.06em}
.sidx{font-weight:800;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
#car{position:absolute;left:0;right:0;top:96px;bottom:150px;display:flex;align-items:center;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#car::-webkit-scrollbar{display:none}
.sk{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;transition:opacity .15s}
.sk .art{width:100%;aspect-ratio:3/4;border-radius:28px;background:#fff center top/cover;box-shadow:0 14px 34px rgba(42,27,82,.25);position:relative}
.sk.own .art{filter:grayscale(1) brightness(1.05) contrast(.8);opacity:.6}
.sk .ok{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.sk .cap{margin-top:14px;text-align:center;line-height:1.4}
.sk .cap b{display:block;font-size:16px;color:var(--ink)}
.sk .cap span{font-size:12px;color:var(--mute)}
.sk.got .art{animation:got .42s cubic-bezier(.3,1.5,.4,1) forwards}
@keyframes got{40%{transform:scale(1.08)}100%{transform:scale(.2) translateY(-200px);opacity:0}}
#dots{position:absolute;left:0;right:0;bottom:104px;display:flex;justify-content:center;gap:7px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--t3);transition:transform .2s}
#dots i.own{background:#fff}
#dots i.on{background:var(--ink);transform:scale(1.4)}
#scSelect .rbar .btn:disabled{opacity:.45}
/* リザルト（ショーケース） */
#scResult{position:fixed;inset:0;z-index:15;overflow:hidden;background:none;color:#fff;flex-direction:column}
#scResult.on{display:flex}
.rbg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 38%,#4a3290,#1d1238 75%);z-index:0}
#scResult>*:not(.rbg){position:relative;z-index:1}
#scResult .rbody{padding-bottom:96px}
#scResult>.rbar{position:absolute}
#scResult.on .rbg{animation:rFade .8s ease both}
#scResult.on .rhd,#scResult.on .rstat,#scResult.on .rbar{animation:rUp .5s ease both;animation-delay:1.1s}
#scResult.on #rHero{animation:rPop .7s cubic-bezier(.2,1.3,.3,1) both;animation-delay:.45s}
#scResult.on #rGrid>div{animation:rPop .5s cubic-bezier(.2,1.4,.3,1) both}
@keyframes rFade{0%{opacity:0;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes rUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes rPop{0%{opacity:0;transform:scale(.6) translateY(30px)}100%{opacity:1;transform:none}}
.rhd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;height:48px}
.rhd img{height:34px}
.rhd span{font-weight:800;font-size:12px;letter-spacing:.16em;opacity:.7}
.rbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
#rGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#rGrid .rcd{height:calc(100% - 20px)}
.rstat{display:none;justify-content:center;align-items:center;gap:14px;height:0;margin-bottom:96px;font-size:13px;font-weight:700}
.rstat b{font-size:20px;font-weight:900}
.rstat span{display:flex;align-items:center;gap:5px;opacity:.85}
#scResult .rbar .btn:not(.main){background:rgba(255,255,255,.14);color:#fff}
.slip .thumb.q{display:flex;align-items:center;justify-content:center;font-size:2.4em;font-weight:900;color:var(--t3);background:var(--t1)}
.slip.sv{background:linear-gradient(150deg,#ffffff,#e4e8ef 45%,#b4bcc9 80%,#e9edf3)}
.slip.sv .tier{color:#5b6475}
.slip .thumb.sv{background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 60%),linear-gradient(150deg,#eef1f5,#c9d0db)}
/* ずかん */
#scColl{position:fixed;inset:0;z-index:15;background:var(--t2);overflow:hidden}
#scColl .ptop{z-index:20}
.cbk{width:38px;height:38px;border-radius:50%;border:none;background:var(--t1);color:var(--ink);font:inherit;font-weight:900;font-size:20px;cursor:pointer;flex:none}
#zTitle{font-size:22px}#zTitle small{font-size:13px;margin-left:2px}
.ctabs{position:absolute;left:12px;right:12px;top:86px;display:flex;gap:6px;background:rgba(255,255,255,.5);border-radius:999px;padding:4px;z-index:20}
.ctabs button{flex:1;height:36px;border:none;border-radius:999px;background:none;font:inherit;font-weight:800;font-size:13px;color:var(--mute);cursor:pointer}
.ctabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(42,27,82,.1)}
.cbody{position:absolute;left:0;right:0;top:136px;bottom:0;overflow-y:auto;padding:4px 14px 100px}
.cbody.csub{top:86px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:136px;border-radius:26px;background:#fff;position:relative;padding:12px 14px;overflow:hidden;cursor:pointer}
.tile[style*="--img"]{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.92)),var(--img) center 20%/cover}
.tile b{font-size:56px;font-weight:900;line-height:1}
.tile .tn{position:absolute;right:14px;top:16px;font-weight:900;font-size:15px}
.tile .cmp{position:absolute;right:12px;top:40px;background:#efc35a;color:#5a3d00;font-size:10px;font-weight:900;border-radius:999px;padding:2px 8px}
.tile .tb{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:4px}
.tile .tb i{flex:1;height:7px;border-radius:4px;background:var(--t1)}.tile .tb i.on{background:var(--pri)}
.binder{background:#fff;border-radius:26px;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;box-shadow:inset 0 0 0 1px var(--t1)}
.pk2{aspect-ratio:3/4;border-radius:12px;padding:5px;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,0) 40%),var(--t1);box-shadow:inset 0 0 0 1.5px rgba(195,169,238,.6);cursor:pointer}
.pk2.none{background:#faf7fe;box-shadow:none;cursor:default}
.ph2{height:100%;border-radius:9px;background:#fff center top/cover;position:relative}
.ph2 .mu{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.em{height:100%;border:2px dashed var(--t3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--t3);font-size:22px}
.tnav{display:flex;justify-content:center;gap:4px;margin-top:18px;font-weight:900;color:var(--mute)}
.tnav span{min-width:28px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:16px;cursor:pointer;font-size:14px}
.tnav span.on{background:#fff;color:var(--ink);font-size:17px}
.pz{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.pzc{width:min(72%,290px);aspect-ratio:3/4;border-radius:26px;background:#fff center top/cover;position:relative;box-shadow:0 14px 34px rgba(42,27,82,.22)}
.pzc.lock{background:var(--t1);box-shadow:inset 0 0 0 2px var(--t3);display:flex;align-items:center;justify-content:center}
.pzc.lock span{font-size:80px;font-weight:900;color:var(--t3)}
.play{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;border:none;background:rgba(42,27,82,.78);color:#fff;font-size:24px;cursor:pointer;backdrop-filter:blur(4px)}
.prog{position:absolute;left:16px;right:16px;bottom:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.6);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--pri)}
.pzt{margin-top:16px;font-weight:900;font-size:18px;text-align:center}
.pzt em{font-style:normal;font-size:11px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:3px}
.pzm{margin:6px 10px 0;font-size:13px;color:var(--mute);text-align:center;line-height:1.6}
.cc{margin-top:16px;width:100%;background:#fff;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.cc div{flex:1;display:flex;flex-direction:column;line-height:1.3}.cc small{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.08em}.cc b{font-size:15px}.cc span{font-size:12px;color:var(--mute)}
.cc i,.mi i,.ar .go{font-style:normal;color:var(--t3);font-weight:900}
.av{flex:none;border-radius:50%;background:#fff center/cover;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ink)}
.alist,.mlist{display:flex;flex-direction:column;gap:10px}
.ar{background:#fff;border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.ai{flex:1;display:flex;flex-direction:column;line-height:1.35}.ai b{font-size:15px}.ai span{font-size:12px;color:var(--mute)}.ai p{margin:4px 0 0;font-size:12px;color:var(--ink)}
.ai em{font-style:normal;font-size:9px;font-weight:900;border-radius:999px;padding:1px 6px;vertical-align:2px;background:var(--t1);color:var(--mute)}.ai em.music{background:var(--ink);color:#fff}
.aw{display:flex;gap:4px;margin-top:6px}.aw i{font-style:normal;width:20px;height:20px;border-radius:6px;background:var(--t1);color:var(--t3);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}.aw i.on{background:var(--pri);color:#fff}
.mlogo{width:180px;align-self:center;margin:6px 0 8px}
.mi{background:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer}
.mi div{flex:1;display:flex;flex-direction:column}.mi b{font-size:17px}.mi span{font-size:12px;color:var(--mute)}
.mim{width:48px;height:48px;border-radius:14px;background:center/cover;flex:none}
#rStat{cursor:pointer}
#scTear .pauto,#scReveal .pauto{z-index:20}
.ibook{position:absolute;top:12px;right:12px;z-index:450;width:72px;height:72px;border-radius:28px;border:none;background:var(--pri);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font:inherit;font-weight:800;font-size:10px;letter-spacing:.02em;box-shadow:0 8px 24px rgba(42,27,82,.2)}
#device.incoll #gPrize,#device.incoll #thiefChip{display:none}
#scCarton .ptop,#scTear .ptop,#scReveal .ptop,#scSelect .ptop{right:92px;height:72px;min-height:0;padding-top:0;padding-bottom:0;box-sizing:border-box}
#scCarton .ptop .plast{margin-left:auto}
.rhd{padding-right:90px}
.gstrip{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:10px 10px 10px 16px;margin-bottom:12px;font-weight:800}
.gstrip span{display:flex;align-items:center;gap:6px}.gstrip .coin{width:18px;height:18px;border:none}.gstrip small{color:var(--mute);font-size:11px}
.gstrip button{height:40px;border:none;border-radius:999px;background:linear-gradient(135deg,#fff6d6,#efc35a 60%,#c99327);color:#5a3d00;font:inherit;font-weight:900;font-size:13px;padding:0 16px;cursor:pointer}
.gstrip button:disabled{opacity:.35;cursor:default}
.rcd{position:relative;width:100%;height:100%;border-radius:14px;background:#fff center top/cover;box-shadow:0 6px 16px rgba(0,0,0,.35);cursor:pointer}
.rcd.big{border-radius:26px}
.tg{display:block;text-align:center;margin-top:5px;color:#fff;font-weight:900;font-size:11px;letter-spacing:.04em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcdx{display:none;justify-content:center}
.rcd.big+.tg{font-size:15px;margin-top:8px}
.rcd .lc{position:absolute;right:8px;top:8px;font-size:18px}
.rcd.sv{background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.8) 45%,rgba(255,255,255,0) 60%),linear-gradient(150deg,#ffffff,#dfe4ec 50%,#aab3c2);cursor:default}
.rcd.sv em{font-style:normal;font-weight:800;font-size:10px;letter-spacing:.08em;color:#4a5263}
.rcd.sv .coin{width:44%;height:auto;aspect-ratio:1}
.rch{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px}
.sc.fly{border-radius:9px;background:#fff url(assets/logo.png) center/66% no-repeat;box-shadow:0 10px 20px rgba(42,27,82,.25)}
.tc .f.aura-C{box-shadow:0 0 0 2px #fff,0 0 16px 5px rgba(239,159,178,.85)}
.tc .f.aura-B{box-shadow:0 0 0 2px #fff,0 0 18px 7px rgba(239,195,90,.95)}
.rcd.gA{animation:rainbow 1.4s linear infinite}
.rcd.gB{box-shadow:0 0 0 2px #fff,0 0 30px 8px rgba(239,195,90,.8)}
.rcd.gC{box-shadow:0 0 0 2px #fff,0 0 24px 6px rgba(239,159,178,.75)}
.aura-C{box-shadow:0 0 0 1.5px #fff,0 0 12px 3px rgba(239,159,178,.75);animation:breathe 1.6s ease-in-out infinite}
.aura-B{box-shadow:0 0 0 1.5px #fff,0 0 14px 5px rgba(239,195,90,.9);animation:breathe 1.1s ease-in-out infinite}
#scCarton.idle .ptop,#scCarton.idle .pauto{display:none}
#scCarton.idle #pile{pointer-events:none}
.dflip .in{border-radius:14px}
.tflash{position:absolute;inset:0;z-index:40;pointer-events:none;animation:tfl .7s ease-out forwards}@keyframes tfl{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.thiefpk{position:absolute;z-index:260;display:flex;flex-direction:column;align-items:center;gap:16px;animation:tdrop .7s cubic-bezier(.5,0,.6,1.4) both;cursor:pointer;transition:transform .6s cubic-bezier(.5,0,.4,1),opacity .6s}
.thiefpk img{width:100%;filter:drop-shadow(0 0 22px rgba(239,195,90,.75)) drop-shadow(0 18px 24px rgba(0,0,0,.35));animation:tglow 1.6s ease-in-out .8s infinite}
.thiefpk .btn{flex:none;width:150px;height:50px;padding:0;opacity:0;animation:tin .4s .9s both}
.thiefpk.fly .btn{display:none}
@keyframes tdrop{0%{transform:translateY(-120vh) rotate(-14deg)}80%{transform:translateY(0) rotate(3deg)}100%{transform:none}}

@keyframes dieRoll{0%{transform:rotate(-8deg) translateY(-4px)}50%{transform:rotate(8deg) translateY(2px)}100%{transform:rotate(-8deg) translateY(-4px)}}

<script>
(()=>{
/* ================= 設定 ================= */
const LINKS={collab:"https://x.com/",etsy:"https://www.etsy.com/shop/SugarCage",patreon:"https://www.patreon.com/sugarcage"};
const SITE_URL=location.href.split('#')[0];
const DEMO=true; // サンプル中：開くたびに集めた景品と金銀をリセット（本番は false）
const REFILL_MIN=10, REFILL_MS=REFILL_MIN*60*1000, MAX_PICK=10, STUCK_RATE=0.2, SHOW_MAX=20;
const RATE_GOLD=0.02, RATE_SILVER=0.05, SILVER_PER_GOLD=10, GOLD_TIERS="CDEFGH";
// 効果音ファイル（差し替え用）。パスを入れると合成音の代わりに鳴る
const SOUND_FILES={pick:"assets/sfx/pick.mp3",slide:"",flip:"assets/sfx/flip.mp3",aura:"assets/sfx/shine.mp3",coin:"assets/sfx/coin.mp3",big:"assets/sfx/reveal.mp3",dice:"assets/sfx/dice.mp3",land:"",stuck:"assets/sfx/stuck.mp3",heart:"assets/sfx/heart.mp3",pull:"assets/sfx/pull.mp3"};
const BEATS=[0,.34,1.01,1.34,1.95,2.27,2.94,3.28]; // 心音の拍（heart.mp3）
const KD=window.KUJI_DATA,COLLABS=KD.collabs,MINE=KD.mine||[];
const PLAN={};KD.prizes.forEach(p=>(PLAN[p.tier]??=[]).push(p.count));
const TCN=KD.thief||{},TC_JA=TCN.name_ja||"泥棒猫賞",TC_EN=TCN.name_en||"THIEF CAT",TC_ICON=TCN.icon||"🐾";
const THIEF=(()=>{const t=KD.thief||{id:"TC",title:"泥棒猫賞",img:"assets/logo.png"};const c=COLLABS[t.collab];return{...t,tier:"TC",artist:c?"@"+c.handle:"",url:c?Object.values(c.links||{})[0]||"":""};})();
const WORKS=KD.prizes.map(p=>{const c=COLLABS[p.collab];return{...p,artist:c?"@"+c.handle:"",url:c?Object.values(c.links||{})[0]||"":""};});
const TOTAL=WORKS.reduce((a,w)=>a+w.count,0);
const TIERS=Object.keys(PLAN).sort(), RANK=t=>TIERS.indexOf(t);
const $=id=>document.getElementById(id);

/* ================= 言語 ================= */
const JA=(navigator.language||"").toLowerCase().startsWith("ja");
const L=JA?{
  lastTo:"ラストキャンディまで",prizes:"景品",refill:"回数を補充",empty:"引ける回数がなくなりました",
  note:"景品はフォロワーさんとのコラボ作品（現在はサンプル）。箱はみんなで共有。<br>最後の1パックを開けた人に 🍬 ラストキャンディ賞。",
  diceTitle:"何回引こうかな",roll:"きめる",go:"パックを選ぶ",n:n=>`${n} 回`,
  refillDesc:"30分ごとに回せます。<br>シェアすると、すぐ回せます。",shareRoll:"シェアする",lCollab:"コラボ作家さん一覧",next:t=>`次まで ${t}`,now:"いま回せます",
  pick:n=>`パックを ${n} つ選ぶ`,auto:"おまかせ",open:"開ける",more:n=>`あと ${n}`,
  stuck:"…止まった",flip:"タップでめくる",flipAll:"ぜんぶめくる",got:n=>`${n} 枚`,
  share:"𝕏 でシェア",plus1:"+1 🎲",again:n=>`もう一度`,againS:n=>`🎲 ${n}`,
  owned:"持ってる",sum:(a,b)=>`${a} / ${b} 種類`,
  goldTitle:"ゴールドパック",goldDesc:"まだ持っていない作品（C〜H賞）から1枚。<br>シルバー10枚でゴールド1枚。",
  gInfo:(g,n)=>`ゴールド ${g}　／　候補 ${n} 作品`,useGold:"ゴールドで開ける",noneLeft:"C〜H賞はすべて持っています",
  toGold:"シルバー10枚 → ゴールド",get lastCandy(){return TC_ICON+" "+TC_JA},thiefPick:"拾う",thiefWait:"あとで",get thiefLost(){return "おしい！"+TC_JA+"はほかの人に…"},artistLink:"作者ページ",
  shareText:(n,line,last)=>`しゅがけ1万人記念くじを${n}パック開けた\n${line}${last?"\n"+TC_ICON+TC_JA:""}\n#しゅがけくじ`
}:{
  lastTo:"LAST CANDY in",prizes:"Prizes",refill:"Refill",empty:"No pulls left",
  note:"All prizes are collab art by our followers (samples for now). One box shared by everyone.<br>Open the very last pack to win 🍬 LAST CANDY.",
  diceTitle:"How many pulls?",roll:"GO",go:"Pick packs",n:n=>`${n} pull${n>1?"s":""}`,
  refillDesc:"Roll every 30 minutes.<br>Share to roll right now.",shareRoll:"Share",lCollab:"Collab artists",next:t=>`Next in ${t}`,now:"Ready",
  pick:n=>`Pick ${n} pack${n>1?"s":""}`,auto:"Auto",open:"Open",more:n=>`${n} more`,
  stuck:"…stuck",flip:"Tap to flip",flipAll:"Flip all",got:n=>`${n} card${n>1?"s":""}`,
  share:"Share on 𝕏",plus1:"+1 🎲",again:n=>`Again`,againS:n=>`🎲 ${n}`,
  owned:"owned",sum:(a,b)=>`${a} / ${b} collected`,
  goldTitle:"Gold Pack",goldDesc:"1 card from works you don't own yet (C–H).<br>10 silver = 1 gold.",
  gInfo:(g,n)=>`Gold ${g}  /  ${n} possible`,useGold:"Open with gold",noneLeft:"You own every C–H work",
  toGold:"10 silver → gold",get lastCandy(){return TC_ICON+" "+TC_EN},thiefPick:"Grab",thiefWait:"later",get thiefLost(){return "So close! Someone else got the "+TC_EN+"…"},artistLink:"Artist page",
  shareText:(n,line,last)=>`Opened ${n} packs in the Sugar Cage 10K KUJI\n${line}${last?"\n"+TC_ICON+" "+TC_EN:""}\n#SugarCageKuji`
};

function drama(r,done,dup){
  const w=r.work,t=r.tier,beats=t==="A"||t==="TC"?8:t==="B"?6:4,len=t==="A"||t==="TC"?3.5:t==="B"?2.5:1.6,tail=0;

  inn.className="in "+aura;inn.style.transition="none";inn.style.transform="rotateY(0deg) scale(.9)";
  d.className="drama on";ac();
  const t0=performance.now();let pulse=0,bi=0,fin=false;
  if(!file("heart",1,len))BEATS.slice(0,beats).forEach(b=>osc(60,.18,{gain:.5,to:40,when:b}));
  const step=n=>{const e=(n-t0)/1000;
    while(bi<beats&&e>=BEATS[bi]){pulse=bi%2?.035:.06;bi++;if(navigator.vibrate)navigator.vibrate(bi%2?25:40);}
    pulse*=.9;
    const k=Math.min(1,e/len), ang=60*k*k; // ゆっくり開く（最大78度）

      const q=(e-len)/.42,v0=120/len*.42/120,ez=q<1?1-Math.pow(1-q,2.2):1,a2=60+120*Math.max(ez,q*v0);

      inn.style.transform=`rotateY(${Math.min(180,a2)}deg) scale(${.96+.04*q})`;requestAnimationFrame(step);}
    else{inn.style.transform="rotateY(180deg) scale(1)";
      d.onclick=()=>{d.className="drama";d.onclick=null;done&&done();};}
  };requestAnimationFrame(step);
}

function onCar(){const car=$("car"),ks=car.children;if(!ks.length)return;const mid=car.scrollLeft+car.clientWidth/2;let best=0,bd=1e9;
  for(let i=0;i<ks.length;i++){const k=ks[i],c=k.offsetLeft+k.offsetWidth/2,dd=Math.abs(c-mid);if(dd<bd){bd=dd;best=i;}

function confetti(n){const cols=["#f6c9d3","#f2d690","#cfe7da","#ddd5f0"];const P=[];
  const dr=DR();for(let i=0;i<n;i++)P.push({x:dr.left+dr.width*(.25+Math.random()*.5),y:dr.top+dr.height*.3,vx:(Math.random()-.5)*8,vy:-5-Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,s:4+Math.random()*4,c:cols[i%4]});
  fxAdd({step(dt){const c=fc;P.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.strokeStyle="rgba(79,65,60,.5)";c.lineWidth=.8;c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);c.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);c.restore();});return P.some(p=>p.y<DR().bottom+20);}});}
