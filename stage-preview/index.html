<style>
:root{--pri:#5b3fa6;--ink:#2a1b52;--mute:#6c5a99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1c1238;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","M PLUS Rounded 1c",sans-serif;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:radial-gradient(120% 60% at 50% 100%,#4a2f86 0%,#2a1b52 45%,#170e2f 100%)}
.top{position:absolute;left:12px;right:12px;top:12px;height:72px;background:#fff;border-radius:36px;display:flex;align-items:center;gap:12px;padding:0 22px 0 14px;z-index:5000;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.back{width:44px;height:44px;border-radius:50%;border:none;background:#efe7fb;color:var(--pri);font:900 20px/1 inherit;display:grid;place-items:center}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;flex:1}
.top .cnt{font-weight:900;font-size:16px;color:var(--mute)}
.spot{position:absolute;top:-10%;width:60%;height:95%;pointer-events:none;mix-blend-mode:screen;opacity:.5;filter:blur(6px)}
.spot.l{left:-12%;background:conic-gradient(from 160deg at 30% 0%,transparent 0deg,rgba(255,214,250,.55) 10deg,transparent 22deg);animation:sw 7s ease-in-out infinite alternate}
.spot.r{right:-12%;background:conic-gradient(from 178deg at 70% 0%,transparent 0deg,rgba(190,220,255,.5) 10deg,transparent 22deg);animation:sw 8s ease-in-out infinite alternate-reverse}
@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#stage{position:absolute;inset:0}
#base{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tri .side{fill:rgba(220,200,255,.22);stroke:none}
.tri .face{fill:url(#acr);stroke:rgba(255,255,255,.85);stroke-width:1.5}
.tri.empty .side{opacity:0}
.tri.empty .face{fill:rgba(255,255,255,.04);stroke:rgba(255,214,250,.7);stroke-dasharray:6 6;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{stroke:rgba(255,255,255,1);fill:rgba(255,214,250,.12)}}
.tri.hot .face{stroke:#fff;stroke-width:3;fill:rgba(255,214,250,.3)}
#base.done .tri .face{animation:hg 1.6s ease-out forwards}
@keyframes hg{0%{stroke-width:1.5}40%{stroke:#fff;stroke-width:6}100%{stroke:#ffe7ff;stroke-width:2.5;filter:drop-shadow(0 0 6px #f6c8ff)}}
.stand{position:absolute;left:0;top:0;transform-origin:50% 100%;cursor:grab;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35));touch-action:none}
.stand img{display:block;height:100%;width:auto;pointer-events:none}
.stand .gl{position:absolute;inset:0;pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;
 background:linear-gradient(115deg,transparent 0%,transparent calc(var(--p) + var(--o) - 16%),rgba(255,255,255,.26) calc(var(--p) + var(--o) - 10%),transparent calc(var(--p) + var(--o) - 5%),transparent calc(var(--p) + var(--o) - 1.5%),rgba(255,255,255,.42) calc(var(--p) + var(--o)),transparent calc(var(--p) + var(--o) + 1.5%),transparent calc(var(--p) + var(--o) + 30%),rgba(255,255,255,.14) calc(var(--p) + var(--o) + 36%),transparent calc(var(--p) + var(--o) + 42%),transparent 100%)}
#stage{--p:40%}
.stand.lift{filter:drop-shadow(0 22px 18px rgba(0,0,0,.45));cursor:grabbing}
#zoom{position:absolute;inset:0;z-index:6000;background:rgba(18,10,40,.82);display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#zoom.on{display:flex;animation:fi .25s}
#zoom img{max-width:84%;max-height:82%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));animation:zi .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes fi{from{opacity:0}}@keyframes zi{from{transform:scale(.7) rotate(-4deg)}}

    const ctr=[W/2+(col-.5)*step, rows[row]-(col==1?Math.sqrt(3)/2*R*SQ:0)];
    const pts=[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3;return [ctr[0]+Math.cos(a)*R,ctr[1]+Math.sin(a)*R*SQ]});
    spots.push({k,row,ctr,pts,sc});}
  G={W,H,h};
}
const pstr=a=>a.map(p=>p.join(',')).join(' ');
function drawBase(){
  svg.setAttribute('width',G.W);svg.setAttribute('height',G.H);tris.innerHTML='';
  [...spots].sort((a,b)=>a.ctr[1]-b.ctr[1]).forEach(s=>{
    const id=order[s.k],g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','tri'+(owned.has(id)?'':' empty'));
    const down=s.pts.map(p=>[p[0],p[1]+TH]);
    g.innerHTML='<polygon class="side" points="'+pstr(down)+'"/><polygon class="face" points="'+pstr(s.pts)+'"/>';
    tris.appendChild(g);s.g=g;});
  svg.classList.toggle('done',owned.size==6);
}
function posStand(id,k){
  const s=spots[k],d=els[id];if(!d)return;
  d.style.height=(G.h*s.sc)+'px';d._x=s.ctr[0];d._y=s.ctr[1]+3;
  d.style.transform=`translate(${d._x}px,${d._y}px) translate(-50%,-100%)`;
  d.style.zIndex=Math.round(s.ctr[1]);
}
function layout(){geo();drawBase();order.forEach((id,k)=>posStand(id,k));}
function place(id,delay){
  const d=document.createElement('div');d.className='stand';d.innerHTML='<img src="'+IMG[id]+'" alt=""><div class="gl"></div>';const gl=d.querySelector('.gl');gl.style.webkitMaskImage=gl.style.maskImage='url('+MASK[id]+')';d.style.setProperty('--o',(order.indexOf(id)%2?6:-4)+(Math.floor(order.indexOf(id)/2)*3)+'%');
  els[id]=d;stage.appendChild(d);bindDrag(d,id);posStand(id,order.indexOf(id));
  const t=d.style.transform;
  d.animate([{transform:t.replace('-100%)','-150%)'),opacity:0},{transform:t,opacity:1}],{duration:600,delay,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});
}
function count(){document.getElementById('cnt').textContent=owned.size+' / 6'}
function nearest(x,y){let b=0,bd=1e9;spots.forEach(s=>{const dd=Math.hypot(x-s.ctr[0],(y-s.ctr[1])*.8);if(dd<bd){bd=dd;b=s.k}});return {k:b,d:bd}}
function bindDrag(d,id){
  let timer=null,lifted=false,sx,sy,moved=false;
  d.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false;d.setPointerCapture(e.pointerId);
    timer=setTimeout(()=>{lifted=true;d.classList.add('lift');d.style.zIndex=4000;d.style.transition='none';
      d.style.transform=`translate(${d._x}px,${d._y-18}px) translate(-50%,-100%) scale(1.06)`;navigator.vibrate&&navigator.vibrate(15)},280)});
  d.addEventListener('pointermove',e=>{
    if(!lifted){if(Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;clearTimeout(timer)}return}
    const r=stage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    d.style.transform=`translate(${x}px,${y+40}px) translate(-50%,-100%) scale(1.06)`;
    const from=order.indexOf(id),n=nearest(x,y+40),ok=Math.floor(n.k/2)==Math.floor(from/2)&&n.k!=from;
    spots.forEach(s=>s.g.classList.toggle('hot',ok&&s.k==n.k));
  });
  const end=e=>{clearTimeout(timer);
    if(lifted){lifted=false;d.classList.remove('lift');d.style.transition='transform .28s cubic-bezier(.3,1.3,.5,1)';
      const r=stage.getBoundingClientRect(),n=nearest(e.clientX-r.left,e.clientY-r.top+40),from=order.indexOf(id);
      if(Math.floor(n.k/2)==Math.floor(from/2)&&n.k!=from){[order[from],order[n.k]]=[order[n.k],order[from]];save()}
      layout();setTimeout(()=>{Object.values(els).forEach(x=>x.style.transition='')},300);
    }else if(!moved){zimg.src=IMG[id];zoom.classList.add('on')}
  };
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
}
// proto: tap an empty hex to insert
stage.addEventListener('click',e=>{if(e.target.closest('.stand'))return;const r=stage.getBoundingClientRect(),n=nearest(e.clientX-r.left,e.clientY-r.top);
  const id=order[n.k];if(n.d<G.W*.15&&!owned.has(id)){owned.add(id);drawBase();place(id,0);count()}});
zoom.onclick=()=>zoom.classList.remove('on');
geo();drawBase();order.forEach((id,i)=>{if(owned.has(id))place(id,250+i*170)});count();
addEventListener('resize',layout);
// reflection follows device tilt (gyro) or mouse
let tgt=40,cur=40,asked=false;
function onTilt(e){if(e.gamma==null)return;const g=e.gamma,b=(e.beta||45)-45;tgt=Math.max(-25,Math.min(125,50+g*1.8+b*.7))}
function ask(){if(asked)return;asked=true;try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',onTilt)}).catch(()=>{})}else addEventListener('deviceorientation',onTilt)}catch(e){}}
addEventListener('pointerdown',ask,{capture:true});
if(!(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'))addEventListener('deviceorientation',onTilt);
addEventListener('mousemove',e=>{const r=stage.getBoundingClientRect();tgt=-10+(e.clientX-r.left)/r.width*120});
(function loop(){cur+=(tgt-cur)*.12;stage.style.setProperty('--p',cur.toFixed(2)+'%');requestAnimationFrame(loop)})();
</script></body></html>
